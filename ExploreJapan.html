<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Explore Japan · Sakura Dining</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<style>
:root{
--ink:#080604;
--paper:#F0E8D5;
--gold:#B8973A;
--gold2:#D4AE52;
--ff-en:'Cormorant Garamond',serif;
--ff-ui:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
background:var(--ink);
color:var(--paper);
font-family:var(--ff-ui);
height:100svh;
overflow:hidden;
display:flex;
flex-direction:column;
}

.back-btn{
position:fixed;
left:16px;
top:max(env(safe-area-inset-top),14px);
z-index:100;
text-decoration:none;
color:var(--paper);
background:rgba(255,255,255,.08);
padding:10px 16px;
border-radius:30px;
border:1px solid rgba(255,255,255,.15);
backdrop-filter:blur(12px);
font-size:11px;
}

.nav-header{
padding:max(env(safe-area-inset-top),20px) 20px 16px;
text-align:center;
border-bottom:1px solid rgba(184,151,58,.2);
}
.nav-header h1{
font-family:var(--ff-en);
font-size:clamp(28px,6vw,40px);
color:var(--gold2);
letter-spacing:.08em;
}
.nav-header p{
margin-top:6px;
font-size:10px;
letter-spacing:.28em;
text-transform:uppercase;
opacity:.6;
}

.explorer-grid{
flex:1;
display:flex;
align-items:center;
gap:18px;
padding:20px 16px;
overflow-x:auto;
overflow-y:hidden;
scroll-snap-type:x mandatory;
scrollbar-width:none;
}
.explorer-grid::-webkit-scrollbar{display:none}

.landmark-card{
flex:0 0 min(85vw,360px);
height:min(64vh,540px);
background:#0f0c09;
border:1px solid rgba(184,151,58,.25);
border-radius:18px;
overflow:hidden;
display:flex;
flex-direction:column;
scroll-snap-align:center;
}

.model-wrap{
flex:1;
position:relative;
overflow:hidden;
min-height:0;
background:radial-gradient(circle at center,#1b160c 0%,#080604 100%);
}

.model-poster{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:1;
transition:.45s;
}
.model-wrap.model-active .model-poster{
opacity:0;
pointer-events:none;
}

model-viewer{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
pointer-events:none;
transition:.4s;
z-index:2;
--poster-color:transparent;
}
.model-wrap.model-active model-viewer{
opacity:1;
pointer-events:auto;
}

model-viewer::part(default-progress-bar),
model-viewer::part(default-ar-button){display:none}

.pinch-hint{
position:absolute;
bottom:12px;
left:50%;
transform:translateX(-50%);
background:rgba(8,6,4,.8);
border:1px solid rgba(184,151,58,.35);
padding:7px 14px;
border-radius:30px;
font-size:9px;
letter-spacing:.12em;
color:var(--gold2);
z-index:10;
opacity:0;
white-space:nowrap;
pointer-events:none;
}
.model-wrap.model-active .pinch-hint{
opacity:1;
animation:fadeout 4s ease 2s forwards;
}
@keyframes fadeout{to{opacity:0}}

.ar-badge{
position:absolute;
right:12px;
top:12px;
padding:6px 12px;
border-radius:30px;
font-size:9px;
background:rgba(8,6,4,.8);
border:1px solid var(--gold);
color:var(--gold2);
opacity:0;
transform:translateY(-8px);
transition:.4s;
z-index:8;
pointer-events:none;
}
.ar-badge.visible{
opacity:1;
transform:translateY(0)
}

.ar-loading{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
gap:12px;
padding:20px;
text-align:center;
background:rgba(8,6,4,.88);
z-index:20;
}
.ar-loading.show{display:flex}
.ar-loading.err .loader-ring,
.ar-loading.err .loader-bar-track{display:none}

.loader-ring{
width:42px;
height:42px;
border-radius:50%;
border:2px solid rgba(184,151,58,.15);
border-top-color:var(--gold2);
animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.loader-bar-track{
width:110px;
height:3px;
background:rgba(184,151,58,.18);
border-radius:10px;
overflow:hidden;
}
.loader-bar-fill{
height:100%;
width:0;
background:var(--gold2);
}
.loader-label{
font-size:10px;
letter-spacing:.14em;
text-transform:uppercase;
line-height:1.6;
}

.landmark-info{
padding:16px;
background:#11100d;
}
.landmark-name{
font-family:var(--ff-en);
font-size:28px;
margin-bottom:4px;
}
.landmark-city{
font-size:10px;
letter-spacing:.18em;
text-transform:uppercase;
color:var(--gold);
margin-bottom:14px;
}

.btn-row{
display:flex;gap:8px}
.action-btn{
border:none;
border-radius:10px;
padding:13px;
font-size:11px;
font-weight:600;
letter-spacing:.1em;
text-transform:uppercase;
min-height:46px;
cursor:pointer;
}
.action-btn:disabled{opacity:.5;cursor:not-allowed}
.view3d-btn{
background:rgba(184,151,58,.14);
color:var(--gold2);
border:1px solid rgba(184,151,58,.35);
}
.view3d-btn.is-active{
background:rgba(184,151,58,.25)
}
.ar-btn{
flex:1;
background:linear-gradient(135deg,var(--gold),var(--gold2));
color:#000;
}
.ar-btn.armed{
animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{50%{transform:scale(1.03)}}

.scroll-dots{
display:flex;
justify-content:center;
gap:8px;
padding:12px 0 max(env(safe-area-inset-bottom),14px);
}
.dot{
width:6px;height:6px;border-radius:50%;
background:rgba(184,151,58,.25)
}
.dot.active{
background:var(--gold2);
transform:scale(1.35)
}

/* ---------- Diagnostics ---------- */
.diag-fab{
position:fixed;
right:14px;
bottom:max(env(safe-area-inset-bottom),12px);
z-index:150;
border:1px solid rgba(184,151,58,.4);
background:rgba(8,6,4,.85);
color:var(--gold2);
border-radius:30px;
padding:9px 14px;
font-size:10px;
letter-spacing:.1em;
cursor:pointer;
}
.diag-panel{
position:fixed;
left:0;right:0;bottom:0;
max-height:70vh;
z-index:200;
display:none;
flex-direction:column;
background:#0f0c09;
border-top:1px solid var(--gold);
border-radius:16px 16px 0 0;
}
.diag-panel.show{display:flex}
.diag-head{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 16px;
border-bottom:1px solid rgba(184,151,58,.25);
font-size:12px;
color:var(--gold2);
}
.diag-head button{
background:none;
border:1px solid rgba(184,151,58,.4);
color:var(--gold2);
border-radius:8px;
padding:6px 10px;
font-size:11px;
margin-left:6px;
}
.diag-body{
padding:14px 16px max(env(safe-area-inset-bottom),16px);
overflow:auto;
font-family:ui-monospace,Menlo,monospace;
font-size:11px;
line-height:1.65;
white-space:pre-wrap;
word-break:break-all;
}
</style>
</head>
<body>

<a href="FunZone.html" class="back-btn">← Back</a>

<div class="nav-header">
<h1>Explore Japan</h1>
<p>Augmented Reality Landmarks</p>
</div>

<div class="explorer-grid" id="grid"></div>
<div class="scroll-dots" id="dots"></div>

<button class="diag-fab" onclick="runDiagnostics()">🛠 Check</button>
<div class="diag-panel" id="diagPanel">
<div class="diag-head">
<span>Diagnostics</span>
<span>
<button onclick="copyDiag()">Copy</button>
<button onclick="document.getElementById('diagPanel').classList.remove('show')">Close</button>
</span>
</div>
<div class="diag-body" id="diagBody"></div>
</div>

<script type="module">
import '@google/model-viewer';
</script>

<script>
/*
  Explore Japan AR viewer
  Expected assets:
    ./ExploreJapan/<folder>/<filename>.glb
    ./ExploreJapan/<folder>/<filename>.png
    ./ExploreJapan/<folder>/<filename>.usdz
  If this HTML is placed INSIDE the ExploreJapan folder, the resolver also tries ./<folder>/...
*/
const landmarks = [
  {name:'Tokyo Skytree', city:'Tokyo', folder:'tokyoskytree', file:'tokyoskytree', usdz:true},
  {name:'Japanese Torii Gate', city:'Japan', folder:'Japanese Torii Gate', file:'Japanese Torii Gate', usdz:true},
  {name:'Japanese Castle', city:'Japan', folder:'japanesecastle', file:'japanesecastle', usdz:true},
  {name:'Nijo Castle', city:'Kyoto', folder:'Nijo Castle japan', file:'Nijo Castle japan', usdz:false},
  {name:'Pagoda', city:'Japan', folder:'pagoda', file:'pagoda', usdz:true},
  {name:'Kimono Dress', city:'Japan', folder:'dress', file:'dress', usdz:true}
];

const AR_LABEL = '🪐 View in Real World';
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/i.test(UA) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(UA);

const grid = document.getElementById('grid');
const dotsEl = document.getElementById('dots');
const state = {};
let lastReport = '';

function encodePath(path) {
  return path.split('/').map(part => encodeURIComponent(part)).join('/');
}
function candidateRoots() {
  return ['./ExploreJapan/', './'];
}
async function findAssetRoot(landmark) {
  for (const root of candidateRoots()) {
    const url = root + encodePath(`${landmark.folder}/${landmark.file}.glb`);
    try {
      const response = await fetch(url, {method:'HEAD', cache:'no-store'});
      if (response.ok) return root;
    } catch (_) {}
  }
  // default is the folder arrangement shown in the user's screenshot
  return './ExploreJapan/';
}
function assetUrls(l, root) {
  const base = root + encodePath(`${l.folder}/${l.file}`);
  return {
    glb: `${base}.glb`,
    usdz: `${base}.usdz`,
    png: `${base}.png`
  };
}
function absolute(url) { return new URL(url, document.baseURI).href; }

function createCard(l, i) {
  const card = document.createElement('div');
  card.className = 'landmark-card';
  card.innerHTML = `
    <div class="model-wrap" id="wrap-${i}">
      <img class="model-poster" id="poster-${i}" alt="${l.name}">
      <model-viewer id="mv-${i}" ar ar-placement="floor" ar-scale="auto"
        camera-controls touch-action="pan-y" loading="lazy"
        environment-image="neutral" shadow-intensity="1"
        exposure="1" interaction-prompt="none"
        style="width:100%;height:100%">
      </model-viewer>
      <div class="ar-loading" id="arload-${i}">
        <div class="loader-ring"></div>
        <div class="loader-bar-track"><div class="loader-bar-fill" id="bar-${i}"></div></div>
        <div class="loader-label" id="lbl-${i}">Loading model...</div>
      </div>
      <div class="ar-badge" id="badge-${i}">✦ 3D Ready</div>
      <div class="pinch-hint">Drag to rotate • Pinch to zoom</div>
    </div>
    <div class="landmark-info">
      <div class="landmark-name">${l.name}</div>
      <div class="landmark-city">${l.city}</div>
      <div class="btn-row">
        <button class="action-btn view3d-btn" id="v3dbtn-${i}" type="button">⬡ 3D</button>
        <button class="action-btn ar-btn" id="arbtn-${i}" type="button">${AR_LABEL}</button>
      </div>
    </div>`;
  grid.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dotsEl.appendChild(dot);

  state[i] = {
    mv: card.querySelector(`#mv-${i}`),
    poster: card.querySelector(`#poster-${i}`),
    wrap: card.querySelector(`#wrap-${i}`),
    load: card.querySelector(`#arload-${i}`),
    bar: card.querySelector(`#bar-${i}`),
    label: card.querySelector(`#lbl-${i}`),
    badge: card.querySelector(`#badge-${i}`),
    arBtn: card.querySelector(`#arbtn-${i}`),
    viewBtn: card.querySelector(`#v3dbtn-${i}`),
    root: null, urls: null, ready: false, loading: false,
    active3D: false, error: null
  };

  card.querySelector(`#v3dbtn-${i}`).addEventListener('click', () => toggle3D(i));
  card.querySelector(`#arbtn-${i}`).addEventListener('click', () => launchAR(i));

  const s = state[i];
  s.mv.addEventListener('progress', e => {
    const pct = Math.round((e.detail?.totalProgress || 0) * 100);
    s.bar.style.width = `${pct}%`;
    s.label.textContent = `Loading ${pct}%`;
  });
  s.mv.addEventListener('load', () => {
    s.ready = true; s.loading = false;
    s.load.classList.remove('show','err');
    s.badge.classList.add('visible');
    s.viewBtn.disabled = false;
    s.arBtn.disabled = false;
  });
  s.mv.addEventListener('error', e => {
    s.loading = false;
    s.error = e.detail?.type || 'Model failed to load';
    s.load.classList.add('show','err');
    s.label.textContent = `Could not load model. Check file path and format.`;
    s.viewBtn.disabled = false;
    s.arBtn.disabled = false;
    console.error('model-viewer error', s.urls?.glb, e);
  });
  s.load.addEventListener('click', () => s.load.classList.remove('show','err'));
}

landmarks.forEach(createCard);

async function setupLandmark(i) {
  const l = landmarks[i], s = state[i];
  s.root = await findAssetRoot(l);
  s.urls = assetUrls(l, s.root);
  s.poster.src = absolute(s.urls.png);
  s.mv.setAttribute('src', absolute(s.urls.glb));
  if (isIOS && l.usdz) s.mv.setAttribute('ios-src', absolute(s.urls.usdz));
  s.mv.setAttribute('ar-modes', isIOS ? 'quick-look' : 'scene-viewer webxr');
}
landmarks.forEach((_, i) => setupLandmark(i));

function showModelLoading(i) {
  const s = state[i];
  if (!customElements.get('model-viewer')) {
    s.load.classList.add('show','err');
    s.label.textContent = '3D viewer did not load. Check internet connection.';
    return false;
  }
  s.loading = true;
  s.mv.setAttribute('loading','eager');
  s.load.classList.remove('err');
  s.load.classList.add('show');
  s.label.textContent = 'Loading 3D model…';
  s.viewBtn.disabled = true;
  return true;
}
function toggle3D(i) {
  const s = state[i];
  if (s.active3D) {
    s.active3D = false;
    s.wrap.classList.remove('model-active');
    s.viewBtn.classList.remove('is-active');
    s.viewBtn.textContent = '⬡ 3D';
    return;
  }
  s.active3D = true;
  s.wrap.classList.add('model-active');
  s.viewBtn.classList.add('is-active');
  s.viewBtn.textContent = '✕ 2D';
  if (!s.ready && !s.loading) showModelLoading(i);
}

function launchAR(i) {
  const l = landmarks[i], s = state[i];
  if (!s.urls) {
    s.label.textContent = 'Preparing model files…';
    s.load.classList.add('show');
    setupLandmark(i).then(() => launchAR(i));
    return;
  }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    alert('AR requires HTTPS. Please open this page from your HTTPS website.');
    return;
  }
  if (isIOS) {
    if (!l.usdz) {
      alert(`iPhone AR needs a USDZ file. Please add ${l.file}.usdz to this model folder.`);
      return;
    }
    // Keep the launch directly inside the user's tap for iOS Quick Look.
    const a = document.createElement('a');
    a.rel = 'ar';
    a.href = absolute(s.urls.usdz) + '#allowsContentScaling=1';
    const img = document.createElement('img');
    img.src = absolute(s.urls.png);
    img.alt = l.name;
    img.style.width = '1px';
    img.style.height = '1px';
    a.appendChild(img);
    a.style.position = 'fixed';
    a.style.left = '0';
    a.style.top = '0';
    a.style.opacity = '0.01';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 2000);
    return;
  }
  if (isAndroid) {
    const modelUrl = absolute(s.urls.glb);
    const fallback = encodeURIComponent(location.href);
    const intent = 'intent://arvr.google.com/scene-viewer/1.0'
      + '?file=' + encodeURIComponent(modelUrl)
      + '&mode=ar_preferred'
      + '&title=' + encodeURIComponent(l.name)
      + '#Intent;scheme=https;package=com.google.android.googlequicksearchbox;'
      + 'action=android.intent.action.VIEW;S.browser_fallback_url=' + fallback + ';end;';
    location.href = intent;
    return;
  }

  // Desktop / supported WebXR browser fallback
  if (!s.ready) {
    if (!s.loading) showModelLoading(i);
    s.arBtn.textContent = 'Model loading…';
    s.mv.addEventListener('load', function onLoad() {
      s.mv.removeEventListener('load', onLoad);
      s.arBtn.textContent = AR_LABEL;
      if (s.mv.canActivateAR) s.mv.activateAR();
      else alert('AR is not supported by this browser/device.');
    });
    return;
  }
  if (s.mv.canActivateAR) s.mv.activateAR();
  else alert('AR is unavailable here. Use Safari on iPhone or Chrome on Android.');
}

// Diagnostics panel
async function checkFile(url, kind) {
  try {
    const r = await fetch(url, {cache:'no-store'});
    if (!r.ok) return `❌ ${kind}: HTTP ${r.status} — ${url}`;
    const reader = r.body?.getReader();
    const first = reader ? await reader.read() : {value:new Uint8Array()};
    reader?.cancel();
    const head = new TextDecoder('latin1').decode((first.value || new Uint8Array()).slice(0,60));
    let verdict = kind === 'GLB'
      ? (head.startsWith('glTF') ? 'GLB signature OK' : 'File does not look like a GLB')
      : (head.startsWith('PK') ? 'USDZ ZIP signature OK' : 'File does not look like USDZ');
    return `✅ ${kind}: ${verdict} — ${url}`;
  } catch (e) {
    return `❌ ${kind}: ${e.message} — ${url}`;
  }
}
async function runDiagnostics() {
  const panel = document.getElementById('diagPanel');
  const body = document.getElementById('diagBody');
  panel.classList.add('show');
  body.textContent = 'Checking…';
  const report = [
    `Page: ${location.href}`,
    `HTTPS/secure context: ${window.isSecureContext}`,
    `Device: ${isIOS ? 'iPhone/iPad' : isAndroid ? 'Android' : 'Other'}`,
    `model-viewer loaded: ${!!customElements.get('model-viewer')}`,
    ''
  ];
  for (let i=0; i<landmarks.length; i++) {
    const l = landmarks[i], s = state[i];
    if (!s.urls) await setupLandmark(i);
    report.push(`— ${l.name} —`);
    report.push(await checkFile(absolute(s.urls.glb), 'GLB'));
    report.push(await checkFile(absolute(s.urls.png), 'PNG'));
    if (l.usdz) report.push(await checkFile(absolute(s.urls.usdz), 'USDZ'));
    report.push(s.error ? `Model error: ${s.error}` : s.ready ? 'Model loaded' : 'Not loaded yet (tap 3D)');
    report.push('');
  }
  lastReport = report.join('\n');
  body.textContent = lastReport;
}
function copyDiag() {
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(lastReport).catch(()=>{});
}
window.runDiagnostics = runDiagnostics;
window.copyDiag = copyDiag;

// Carousel dot tracking
const dots = dotsEl.querySelectorAll('.dot');
grid.addEventListener('scroll', () => {
  const center = grid.scrollLeft + grid.clientWidth/2;
  let closest = 0, minDist = Infinity;
  grid.querySelectorAll('.landmark-card').forEach((card, idx) => {
    const dist = Math.abs(card.offsetLeft + card.offsetWidth/2 - center);
    if (dist < minDist) { minDist = dist; closest = idx; }
  });
  dots.forEach((dot, idx) => dot.classList.toggle('active', idx === closest));
}, {passive:true});
</script>
</body>
</html>
