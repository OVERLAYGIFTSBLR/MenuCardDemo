<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Explore Japan · Sakura Dining</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<style>
:root{
--ink:#080604;
--paper:#F0E8D5;
--gold:#B8973A;
--gold2:#D4AE52;
--ff-en:'Cormorant Garamond',serif;
--ff-ui:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
background:var(--ink);
color:var(--paper);
font-family:var(--ff-ui);
height:100svh;
overflow:hidden;
display:flex;
flex-direction:column;
}

.back-btn{
position:fixed;
left:16px;
top:max(env(safe-area-inset-top),14px);
z-index:100;
text-decoration:none;
color:var(--paper);
background:rgba(255,255,255,.08);
padding:10px 16px;
border-radius:30px;
border:1px solid rgba(255,255,255,.15);
backdrop-filter:blur(12px);
font-size:11px;
}

.nav-header{
padding:max(env(safe-area-inset-top),20px) 20px 16px;
text-align:center;
border-bottom:1px solid rgba(184,151,58,.2);
}
.nav-header h1{
font-family:var(--ff-en);
font-size:clamp(28px,6vw,40px);
color:var(--gold2);
letter-spacing:.08em;
}
.nav-header p{
margin-top:6px;
font-size:10px;
letter-spacing:.28em;
text-transform:uppercase;
opacity:.6;
}

.explorer-grid{
flex:1;
display:flex;
align-items:center;
gap:18px;
padding:20px 16px;
overflow-x:auto;
overflow-y:hidden;
scroll-snap-type:x mandatory;
scrollbar-width:none;
}
.explorer-grid::-webkit-scrollbar{display:none}

.landmark-card{
flex:0 0 min(85vw,360px);
height:min(64vh,540px);
background:#0f0c09;
border:1px solid rgba(184,151,58,.25);
border-radius:18px;
overflow:hidden;
display:flex;
flex-direction:column;
scroll-snap-align:center;
}

.model-wrap{
flex:1;
position:relative;
overflow:hidden;
min-height:0;
background:radial-gradient(circle at center,#1b160c 0%,#080604 100%);
}

.model-poster{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:1;
transition:.45s;
}
.model-wrap.model-active .model-poster{
opacity:0;
pointer-events:none;
}

model-viewer{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
pointer-events:none;
transition:.4s;
z-index:2;
--poster-color:transparent;
}
.model-wrap.model-active model-viewer{
opacity:1;
pointer-events:auto;
}

model-viewer::part(default-progress-bar),
model-viewer::part(default-ar-button){display:none}

.pinch-hint{
position:absolute;
bottom:12px;
left:50%;
transform:translateX(-50%);
background:rgba(8,6,4,.8);
border:1px solid rgba(184,151,58,.35);
padding:7px 14px;
border-radius:30px;
font-size:9px;
letter-spacing:.12em;
color:var(--gold2);
z-index:10;
opacity:0;
white-space:nowrap;
pointer-events:none;
}
.model-wrap.model-active .pinch-hint{
opacity:1;
animation:fadeout 4s ease 2s forwards;
}
@keyframes fadeout{to{opacity:0}}

.ar-badge{
position:absolute;
right:12px;
top:12px;
padding:6px 12px;
border-radius:30px;
font-size:9px;
background:rgba(8,6,4,.8);
border:1px solid var(--gold);
color:var(--gold2);
opacity:0;
transform:translateY(-8px);
transition:.4s;
z-index:8;
pointer-events:none;
}
.ar-badge.visible{
opacity:1;
transform:translateY(0)
}

.ar-loading{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
gap:12px;
padding:20px;
text-align:center;
background:rgba(8,6,4,.88);
z-index:20;
}
.ar-loading.show{display:flex}
.ar-loading.err .loader-ring,
.ar-loading.err .loader-bar-track{display:none}

.loader-ring{
width:42px;
height:42px;
border-radius:50%;
border:2px solid rgba(184,151,58,.15);
border-top-color:var(--gold2);
animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.loader-bar-track{
width:110px;
height:3px;
background:rgba(184,151,58,.18);
border-radius:10px;
overflow:hidden;
}
.loader-bar-fill{
height:100%;
width:0;
background:var(--gold2);
}
.loader-label{
font-size:10px;
letter-spacing:.14em;
text-transform:uppercase;
line-height:1.6;
}

.landmark-info{
padding:16px;
background:#11100d;
}
.landmark-name{
font-family:var(--ff-en);
font-size:28px;
margin-bottom:4px;
}
.landmark-city{
font-size:10px;
letter-spacing:.18em;
text-transform:uppercase;
color:var(--gold);
margin-bottom:14px;
}

.btn-row{
display:flex;gap:8px}
.action-btn{
border:none;
border-radius:10px;
padding:13px;
font-size:11px;
font-weight:600;
letter-spacing:.1em;
text-transform:uppercase;
min-height:46px;
cursor:pointer;
}
.action-btn:disabled{opacity:.5;cursor:not-allowed}
.view3d-btn{
background:rgba(184,151,58,.14);
color:var(--gold2);
border:1px solid rgba(184,151,58,.35);
}
.view3d-btn.is-active{
background:rgba(184,151,58,.25)
}
.ar-btn{
flex:1;
background:linear-gradient(135deg,var(--gold),var(--gold2));
color:#000;
}
.ar-btn.armed{
animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{50%{transform:scale(1.03)}}

.scroll-dots{
display:flex;
justify-content:center;
gap:8px;
padding:12px 0 max(env(safe-area-inset-bottom),14px);
}
.dot{
width:6px;height:6px;border-radius:50%;
background:rgba(184,151,58,.25)
}
.dot.active{
background:var(--gold2);
transform:scale(1.35)
}

/* ---------- Diagnostics ---------- */
.diag-fab{
position:fixed;
right:14px;
bottom:max(env(safe-area-inset-bottom),12px);
z-index:150;
border:1px solid rgba(184,151,58,.4);
background:rgba(8,6,4,.85);
color:var(--gold2);
border-radius:30px;
padding:9px 14px;
font-size:10px;
letter-spacing:.1em;
cursor:pointer;
}
.diag-panel{
position:fixed;
left:0;right:0;bottom:0;
max-height:70vh;
z-index:200;
display:none;
flex-direction:column;
background:#0f0c09;
border-top:1px solid var(--gold);
border-radius:16px 16px 0 0;
}
.diag-panel.show{display:flex}
.diag-head{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 16px;
border-bottom:1px solid rgba(184,151,58,.25);
font-size:12px;
color:var(--gold2);
}
.diag-head button{
background:none;
border:1px solid rgba(184,151,58,.4);
color:var(--gold2);
border-radius:8px;
padding:6px 10px;
font-size:11px;
margin-left:6px;
}
.diag-body{
padding:14px 16px max(env(safe-area-inset-bottom),16px);
overflow:auto;
font-family:ui-monospace,Menlo,monospace;
font-size:11px;
line-height:1.65;
white-space:pre-wrap;
word-break:break-all;
}
</style>
</head>
<body>

<a href="FunZone.html" class="back-btn">← Back</a>

<div class="nav-header">
<h1>Explore Japan</h1>
<p>Augmented Reality Landmarks</p>
</div>

<div class="explorer-grid" id="grid"></div>
<div class="scroll-dots" id="dots"></div>

<button class="diag-fab" onclick="runDiagnostics()">🛠 Check</button>
<div class="diag-panel" id="diagPanel">
<div class="diag-head">
<span>Diagnostics</span>
<span>
<button onclick="copyDiag()">Copy</button>
<button onclick="document.getElementById('diagPanel').classList.remove('show')">Close</button>
</span>
</div>
<div class="diag-body" id="diagBody"></div>
</div>

<script>
const landmarks=[
{name:'Tokyo Skytree',city:'Tokyo',folder:'tokyoskytree',file:'tokyoskytree',hasUsdz:true},
{name:'Japanese Torii Gate',city:'Japan',folder:'Japanese Torii Gate',file:'Japanese Torii Gate',hasUsdz:true},
{name:'Japanese Castle',city:'Japan',folder:'japanesecastle',file:'japanesecastle',hasUsdz:true},
{name:'Nijo Castle',city:'Kyoto',folder:'Nijo Castle japan',file:'Nijo Castle japan',hasUsdz:false},
{name:'Pagoda',city:'Japan',folder:'pagoda',file:'pagoda',hasUsdz:true},
{name:'Kimono Dress',city:'Japan',folder:'dress',file:'dress',hasUsdz:true}
];

const AR_LABEL='🪐 View in Real World';
const UA=navigator.userAgent;
const isIOS=/iPhone|iPad|iPod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=/Android/i.test(UA);

const grid=document.getElementById('grid');
const dotsEl=document.getElementById('dots');

// Build absolute, URL-encoded paths (handles spaces in folder / file names)
function paths(l){
const base=`ExploreJapan/${l.folder}/${l.file}`;
return{
glb:encodeURI(`${base}.glb`),
usdz:encodeURI(`${base}.usdz`),
png:encodeURI(`${base}.png`)
};
}
function abs(u){return new URL(u,location.href).href}

landmarks.forEach((l,i)=>{
const p=paths(l);

const card=document.createElement('div');
card.className='landmark-card';

card.innerHTML=`
<div class="model-wrap" id="wrap-${i}">

<img class="model-poster" src="${p.png}" alt="${l.name}">

<model-viewer
id="mv-${i}"
src="${p.glb}"
${isIOS&&l.hasUsdz?`ios-src="${p.usdz}"`:''}
ar
ar-modes="${isIOS?'quick-look webxr':'scene-viewer webxr'}"
ar-placement="floor"
ar-scale="auto"
loading="${i===0?'eager':'lazy'}"
environment-image="neutral"
shadow-intensity="1.2"
shadow-softness="0.8"
exposure="1.1"
camera-controls
touch-action="pan-y"
min-camera-orbit="auto auto 8%"
max-camera-orbit="auto auto 900%"
field-of-view="18deg"
interpolation-decay="200"
interaction-prompt="none">
</model-viewer>

<div class="ar-loading" id="arload-${i}">
<div class="loader-ring"></div>
<div class="loader-bar-track"><div class="loader-bar-fill" id="bar-${i}"></div></div>
<div class="loader-label" id="lbl-${i}">Loading model...</div>
</div>

<div class="ar-badge" id="badge-${i}">✦ AR Ready</div>
<div class="pinch-hint">⟺ Pinch Zoom • Drag Rotate • Scale in AR</div>
</div>

<div class="landmark-info">
<div class="landmark-name">${l.name}</div>
<div class="landmark-city">${l.city}</div>
<div class="btn-row">
<button class="action-btn view3d-btn" id="v3dbtn-${i}" onclick="toggle3D(${i})">⬡ 3D</button>
<button class="action-btn ar-btn" id="arbtn-${i}" onclick="launchAR(${i})">${AR_LABEL}</button>
</div>
</div>`;

grid.appendChild(card);

const dot=document.createElement('div');
dot.className='dot'+(i===0?' active':'');
dotsEl.appendChild(dot);
});

const state={};

landmarks.forEach((l,i)=>{
const s={
mv:document.getElementById(`mv-${i}`),
arload:document.getElementById(`arload-${i}`),
bar:document.getElementById(`bar-${i}`),
lbl:document.getElementById(`lbl-${i}`),
badge:document.getElementById(`badge-${i}`),
arbtn:document.getElementById(`arbtn-${i}`),
v3dbtn:document.getElementById(`v3dbtn-${i}`),
wrap:document.getElementById(`wrap-${i}`),
ready:false,loading:false,showing3D:false,pending3D:false,pendingAR:false,timer:null,error:null
};
state[i]=s;

// tap the overlay to dismiss it
s.arload.addEventListener('click',()=>{
s.arload.classList.remove('show','err');
s.pending3D=false;
s.pendingAR=false;
});

s.mv.addEventListener('progress',(e)=>{
const pct=Math.round(e.detail.totalProgress*100);
s.bar.style.width=pct+'%';
s.lbl.textContent=`Loading ${pct}%`;
});

s.mv.addEventListener('load',()=>{
clearTimeout(s.timer);
s.ready=true;
s.loading=false;
s.arload.classList.remove('show','err');
s.badge.classList.add('visible');
if(s.pending3D){s.pending3D=false;activate3DView(i)}
if(s.pendingAR){
s.pendingAR=false;
s.arbtn.innerHTML='✦ Tap to open AR';
s.arbtn.classList.add('armed');
}
});

s.mv.addEventListener('error',(e)=>{
clearTimeout(s.timer);
const d=e.detail||{};
s.error=(d.sourceError&&d.sourceError.message)||d.type||'unknown error';
console.error('Model failed to load:',s.mv.src,e.detail||e);
s.loading=false;
s.pending3D=false;
s.pendingAR=false;
s.arload.classList.add('show','err');
s.lbl.textContent='Could not load model file. Tap 🛠 Check for details.';
s.v3dbtn.disabled=true;
});

s.mv.addEventListener('ar-status',(e)=>{
if(e.detail.status==='failed')console.warn('AR failed for',s.mv.src);
});
});

function resetARButton(i){
const s=state[i];
s.arbtn.classList.remove('armed');
s.arbtn.innerHTML=AR_LABEL;
}

function activate3DView(i){
const s=state[i];
s.showing3D=true;
s.wrap.classList.add('model-active');
s.v3dbtn.classList.add('is-active');
s.v3dbtn.innerHTML='✕ 2D';
}

function deactivate3DView(i){
const s=state[i];
s.showing3D=false;
s.wrap.classList.remove('model-active');
s.v3dbtn.classList.remove('is-active');
s.v3dbtn.innerHTML='⬡ 3D';
}

function startLoading(i){
const s=state[i];
if(!customElements.get('model-viewer')){
s.arload.classList.add('show','err');
s.lbl.textContent='3D viewer library did not load (internet blocked?). Tap 🛠 Check.';
return;
}
s.loading=true;
s.mv.setAttribute('loading','eager');
s.arload.classList.remove('err');
s.arload.classList.add('show');
s.lbl.textContent='Loading model...';
clearTimeout(s.timer);
s.timer=setTimeout(()=>{
if(!s.ready&&!s.error){
s.lbl.textContent='Still loading… file may be too large. Tap to close.';
}
},15000);
}

function toggle3D(i){
const s=state[i];
if(s.showing3D){deactivate3DView(i);return}
if(s.ready){activate3DView(i)}
else{
s.pending3D=true;
if(!s.loading)startLoading(i);
}
}

// ---- Direct AR launchers (run straight from the user's tap, no waiting for the model) ----
function openQuickLook(usdzUrl){
const a=document.createElement('a');
a.setAttribute('rel','ar');
a.href=usdzUrl+'#allowsContentScaling=1';
a.appendChild(document.createElement('img'));
a.style.display='none';
document.body.appendChild(a);
a.click();
setTimeout(()=>a.remove(),1000);
}

function openSceneViewer(glbUrl,title){
const fallback=encodeURIComponent(location.href);
const intent='intent://arvr.google.com/scene-viewer/1.0'
+'?file='+encodeURIComponent(glbUrl)
+'&mode=ar_preferred'
+'&title='+encodeURIComponent(title)
+'#Intent;scheme=https;package=com.google.android.googlequicksearchbox;'
+'action=android.intent.action.VIEW;S.browser_fallback_url='+fallback+';end;';
window.location.href=intent;
}

function launchAR(i){
const s=state[i];
const l=landmarks[i];
const p=paths(l);

if(location.protocol==='file:'){
alert('This page is opened as a local file. AR needs the page to be hosted on an HTTPS website (GitHub Pages, Netlify, Vercel).');
return;
}

// iPhone / iPad: Quick Look straight from the .usdz
if(isIOS&&l.hasUsdz){
openQuickLook(abs(p.usdz));
return;
}

// Android: Scene Viewer straight from the .glb (must be HTTPS)
if(isAndroid){
if(location.protocol!=='https:'){
alert('Android AR needs HTTPS. Open the hosted https:// version of this page.');
return;
}
openSceneViewer(abs(p.glb),l.name);
return;
}

// Everything else (iOS without a usdz, WebXR browsers): use model-viewer
if(s.ready){
if(s.mv.canActivateAR){
s.mv.activateAR();
}else{
alert('AR is not available on this device/browser. Open this page on a phone: Safari on iPhone, Chrome on Android.');
}
resetARButton(i);
}else{
s.pendingAR=true;
if(!s.loading)startLoading(i);
}
}

// ---------------- Diagnostics ----------------
async function checkFile(url,kind){
try{
const r=await fetch(url,{cache:'no-store'});
if(!r.ok)return `❌ ${kind}: HTTP ${r.status} ${r.statusText}  ← ${url}`;
const reader=r.body.getReader();
const {value}=await reader.read();
reader.cancel();
const head=new TextDecoder('latin1').decode(value.slice(0,60));
const len=r.headers.get('content-length');
const mb=len?(len/1048576).toFixed(1)+' MB':'size unknown';
const ct=r.headers.get('content-type')||'no content-type';
let verdict;
if(kind==='GLB'){
if(head.startsWith('glTF'))verdict='valid GLB';
else if(head.startsWith('version https://git-lfs'))verdict='❌ Git LFS pointer, NOT the real model';
else if(head.trim().startsWith('<'))verdict='❌ got an HTML page (wrong path / 404 page)';
else verdict='❌ not a valid GLB file';
}else{
if(head.startsWith('PK'))verdict='valid USDZ';
else if(head.startsWith('version https://git-lfs'))verdict='❌ Git LFS pointer, NOT the real model';
else if(head.trim().startsWith('<'))verdict='❌ got an HTML page (wrong path / 404 page)';
else verdict='❌ not a valid USDZ file';
}
const icon=verdict.startsWith('❌')?'❌':(len&&len>15728640?'⚠️':'✅');
const big=(len&&len>15728640)?'  (large: may fail on phones)':'';
return `${icon} ${kind}: ${verdict}, ${mb}, ${ct}${big}`;
}catch(e){
return `❌ ${kind}: fetch failed (${e.message}) ← ${url}`;
}
}

let lastReport='';
async function runDiagnostics(){
const panel=document.getElementById('diagPanel');
const body=document.getElementById('diagBody');
panel.classList.add('show');
body.textContent='Running checks…';
const out=[];

out.push(`Page: ${location.href}`);
if(location.protocol==='file:')out.push('❌ Opened as a local file. Models cannot load and AR cannot start. Host it on HTTPS.');
else if(location.protocol==='http:'&&!['localhost','127.0.0.1'].includes(location.hostname))out.push('❌ Plain HTTP. Android Scene Viewer needs HTTPS.');
else out.push('✅ Protocol OK: '+location.protocol);
out.push(`${window.isSecureContext?'✅':'❌'} Secure context: ${window.isSecureContext}`);
out.push(`${customElements.get('model-viewer')?'✅':'❌'} model-viewer library loaded`);
out.push(`Device: ${isIOS?'iOS':isAndroid?'Android':'Desktop / other'}`);
out.push(`Browser: ${UA}`);
out.push('');

for(let i=0;i<landmarks.length;i++){
const l=landmarks[i];
const p=paths(l);
out.push(`── ${l.name}`);
out.push(await checkFile(p.glb,'GLB'));
if(l.hasUsdz)out.push(await checkFile(p.usdz,'USDZ'));
const s=state[i];
if(s.error)out.push(`❌ model-viewer error: ${s.error}`);
else if(s.ready)out.push(`✅ model loaded in viewer · canActivateAR: ${s.mv.canActivateAR}`);
else out.push('… not loaded yet (tap 3D to load)');
out.push('');
}

lastReport=out.join('\n');
body.textContent=lastReport;
}

function copyDiag(){
if(navigator.clipboard)navigator.clipboard.writeText(lastReport).catch(()=>{});
}

// dots
const dots=dotsEl.querySelectorAll('.dot');
grid.addEventListener('scroll',()=>{
const center=grid.scrollLeft+grid.clientWidth/2;
let closest=0,minDist=Infinity;
grid.querySelectorAll('.landmark-card').forEach((card,ci)=>{
const dist=Math.abs((card.offsetLeft+card.offsetWidth/2)-center);
if(dist<minDist){minDist=dist;closest=ci;}
});
dots.forEach((d,di)=>d.classList.toggle('active',di===closest));
},{passive:true});
</script>

</body>
</html>
